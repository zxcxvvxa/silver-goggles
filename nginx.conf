worker_processes auto;
events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}
http {
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;
    tcp_nodelay on;
    tcp_nopush off;
    sendfile off;
    keepalive_timeout 3600;

    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "S2w0eVY4bTBRN3pQNjFqWA==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;

        # Subscription Endpoint
        location /sub {
            proxy_pass http://127.0.0.1:8000/sub;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /cxlvin {
            proxy_pass http://127.0.0.1:2222;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # VLESS WebSocket
        location /CxlvinVlWS {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10085;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Trojan WebSocket
        location /CxlvinTRWS {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10086;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            return 302 https://youtu.be/z-3Cnrqe_uA?si=fKWe2-MvCv37dwYV;
        }
    }
}
